<div class="space-y-6">
  <div class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm dark:border-gray-800 dark:bg-white/[0.03]">
    <div class="flex items-center gap-4">
      <a routerLink="/embarcaciones" class="text-gray-500 hover:text-gray-700 dark:text-gray-400">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div>
        <h1 class="text-2xl font-bold text-gray-800 dark:text-white/90">Nueva embarcación</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Registra una nueva embarcación en la flota.</p>
      </div>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-800 dark:bg-white/[0.03]">
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">

      <div *ngIf="errorMessage" class="rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-600 dark:border-red-900/30 dark:bg-red-500/10 dark:text-red-400">
        {{ errorMessage }}
      </div>

      <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <!-- Nombre -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Nombre *</label>
          <input formControlName="name" type="text" placeholder="Ej: La Perla del Mar"
            class="h-11 w-full rounded-lg border px-4 text-sm outline-none focus:border-brand-500"
            [class.border-red-500]="isInvalid('name')" [class.border-gray-300]="!isInvalid('name')" />
          <p *ngIf="isInvalid('name')" class="mt-1 text-xs text-red-500">Nombre requerido (mín. 2 caracteres).</p>
        </div>

        <!-- Tipo -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Tipo *</label>
          <select formControlName="type"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm outline-none focus:border-brand-500 dark:border-gray-700 dark:text-white/90">
            <option value="LANCHA">Lancha</option>
            <option value="YATE">Yate</option>
            <option value="CATAMARAN">Catamarán</option>
            <option value="BOTE">Bote</option>
          </select>
        </div>

        <!-- Capacidad -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Capacidad (personas) *</label>
          <input formControlName="capacity" type="number" min="1"
            class="h-11 w-full rounded-lg border px-4 text-sm outline-none focus:border-brand-500"
            [class.border-red-500]="isInvalid('capacity')" [class.border-gray-300]="!isInvalid('capacity')" />
        </div>

        <!-- Precio por día -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Precio por día (USD)</label>
          <input formControlName="pricePerDay" type="number" min="0" placeholder="Solo para Yate/Catamarán"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm outline-none focus:border-brand-500 dark:border-gray-700 dark:text-white/90" />
        </div>

        <!-- Matrícula -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Matrícula</label>
          <input formControlName="licensePlate" type="text" placeholder="Ej: ABC-1234"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm outline-none focus:border-brand-500 dark:border-gray-700 dark:text-white/90" />
        </div>

        <!-- Año -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Año de fabricación</label>
          <input formControlName="year" type="number" placeholder="Ej: 2020"
            class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm outline-none focus:border-brand-500 dark:border-gray-700 dark:text-white/90" />
        </div>

        <!-- Provider ID -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">ID Proveedor *</label>
          <input formControlName="providerId" type="number"
            class="h-11 w-full rounded-lg border px-4 text-sm outline-none focus:border-brand-500"
            [class.border-red-500]="isInvalid('providerId')" [class.border-gray-300]="!isInvalid('providerId')" />
        </div>
      </div>

      <!-- Descripción -->
      <div>
        <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300">Descripción</label>
        <textarea formControlName="description" rows="3" placeholder="Descripción de la embarcación..."
          class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-3 text-sm outline-none focus:border-brand-500 dark:border-gray-700 dark:text-white/90"></textarea>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <a routerLink="/embarcaciones"
          class="rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300">
          Cancelar
        </a>
        <button type="submit" [disabled]="saving"
          class="rounded-lg bg-brand-500 px-5 py-2.5 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-60">
          {{ saving ? 'Guardando...' : 'Guardar embarcación' }}
        </button>
      </div>

    </form>
  </div>
</div>
